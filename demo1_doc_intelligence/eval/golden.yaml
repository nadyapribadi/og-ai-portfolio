# Golden set for demo1 retrieval evaluation.
#
# Expected pages were taken from the document text itself (page-level
# extraction), not from memory. Pages are 1-based and match the printed page
# numbers — confirmed against the document's own table of contents.
#
# Where an answer legitimately spans several pages, every acceptable page is
# listed. `expected_file` is mandatory; `expected_pages` may be empty when only
# the document matters.
questions:
  # ── 459 — IOGP Life-Saving Rules ──
  - id: en-01
    lang: en
    question: "What are the nine life saving rules?"
    expected_file: "459.pdf"
    expected_pages: [8]

  - id: en-02
    lang: en
    question: "What must I do before entering a confined space?"
    expected_file: "459.pdf"
    expected_pages: [8, 13]

  - id: en-03
    lang: en
    question: "What are the hot work requirements?"
    expected_file: "459.pdf"
    expected_pages: [15]

  - id: en-04
    lang: en
    question: "What is required before walking under a suspended load?"
    expected_file: "459.pdf"
    expected_pages: [17]

  # ── 456 — Process safety KPIs ──
  - id: en-05
    lang: en
    question: "What does LOPC stand for and what are its consequences?"
    expected_file: "456.pdf"
    expected_pages: [9, 16]

  - id: en-06
    lang: en
    question: "What is the difference between a Tier 1 and a Tier 2 process safety event?"
    expected_file: "456.pdf"
    expected_pages: [16, 18, 48]

  - id: en-07
    lang: en
    question: "How are process safety KPIs defined and measured?"
    expected_file: "456.pdf"
    expected_pages: [11, 16]

